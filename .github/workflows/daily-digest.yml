name: AI Builders Digest (MWF)

on:
  schedule:
    # 06:00 UTC = 08:00 Zurich (CEST) / 07:00 Zurich (CET) — Mon/Wed/Fri
    - cron: '0 6 * * 1,3,5'
  workflow_dispatch:  # Manual trigger from GitHub UI

permissions:
  contents: write  # Required for git push

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Suppress Node 20 deprecation warning

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run full pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          set -e
          ISSUE_DATE=$(date -u +%Y-%m-%d)
          JSON_PATH="data/issues/ai-builders-digest-${ISSUE_DATE}.json"

          echo "=== Generate local feeds ==="
          if ! node scripts/generate-feed.js; then
            echo "WARN: feed generation failed; continuing with committed feeds if present"
          fi

          echo "=== Generate magazine JSON ==="
          SHOULD_GENERATE=1
          if [ -f "$JSON_PATH" ]; then
            CARD_COUNT=$(node -e "const j=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));console.log(j.sections.reduce((s,sec)=>s+(sec.cards?.length||0),0))" "$JSON_PATH")
            if [ "$CARD_COUNT" -gt 3 ]; then
              echo "SKIP: ${JSON_PATH} already has ${CARD_COUNT} cards (preserving existing)"
              SHOULD_GENERATE=0
            else
              echo "Existing JSON is thin (${CARD_COUNT} cards), regenerating..."
            fi
          fi

          if [ "$SHOULD_GENERATE" -eq 1 ]; then
            set +e
            node scripts/generate-magazine-json.js --date "$ISSUE_DATE"
            GEN_EXIT=$?
            set -e
            if [ "$GEN_EXIT" -ne 0 ]; then
              echo "WARN: magazine generation exited ${GEN_EXIT}; skip render/telegram unless JSON exists"
            fi
          fi

          if [ ! -f "$JSON_PATH" ]; then
            echo "WARN: ${JSON_PATH} missing — skip render, archive, telegram (job stays green)"
            exit 0
          fi

          echo "=== Issue ledger ==="
          node -e "
            const fs = require('fs');
            const issue = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
            const meta = issue.meta;
            if (!meta) { console.log('meta: (legacy issue, no ledger)'); process.exit(0); }
            console.log('provider=' + meta.provider);
            console.log('model=' + meta.model);
            console.log('tokensIn=' + meta.tokensIn);
            console.log('tokensOut=' + meta.tokensOut);
            console.log('estCostUsd=' + meta.estCostUsd);
            console.log('cardsPublished=' + meta.cardsPublished);
            console.log('repairAttempts=' + meta.repairAttempts);
          " "$JSON_PATH"

          echo "=== Render HTML ==="
          node scripts/render-ai-builders-digest.js "$JSON_PATH"

          echo "=== Update archive ==="
          node scripts/update-index-archive.js

          echo "=== Send to Telegram ==="
          node scripts/send-telegram.js

      - name: Commit and push
        run: |
          git config user.name "AI Builders Digest Bot"
          git config user.email "digest-bot@ai-builders.dev"
          git add data/ issues/ index.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Digest $(date +%Y-%m-%d)"
            git push
          fi
